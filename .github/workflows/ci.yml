name: IntuneGuard Studio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-stdlib-and-tests:
    name: Test (${{ matrix.os }} / Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (Zero Third-Party Dependencies)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check all Python modules
        shell: bash
        run: python -m py_compile app.py mcp_server.py backend/*.py tests/*.py

      - name: Run full end-to-end verification suite
        shell: bash
        run: python -m unittest discover -s tests -v

  verify-docker-build:
    name: Verify Hardened Docker Build
    runs-on: ubuntu-latest
    needs: verify-stdlib-and-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build non-root container image
        run: docker build -t intuneguard-studio:ci .
